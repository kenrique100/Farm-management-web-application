version: '3.8'
services: 
   back-end:
    container_name: back-end
    image: kbf-api
    restart: always
    build: 
       context: Api
       dockerfile : Dockerfile
    ports: 
          - 10.0.0.54:8080:8080
    environment:
        MYSQL_HOST: mysqldb
        MYSQL_USER: 
        MYSQL_PASSWORD: 
        MYSQL_PORT: 3306
    depends_on:
      - mysqldb
   front-end:
       build:
         context: front-end
         dockerfile : Dockerfile
       ports: 
        - 10.0.0.54:80:80
       depends_on : 
        - back-end
   mysqldb:
    container_name: mysqldb
    image: mysql:8.0.32
    restart: always
    environment:
        MYSQL_DATABASE: 
        MYSQL_ROOT_PASSWORD: 
        MYSQL_USER: 
        MYSQL_PASSWORD:     
    ports:
      - '10.0.0.54:3306:3306'
    volumes: 
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
      
   
 
    
